<text x="752.0" y="420.0" font-size="11.5" font-weight="bold" fill="#222" text-anchor="start">Il verdetto in cinque righe</text>
<text x="752.0" y="454.0" font-size="9" fill="#222" text-anchor="start">1. Sotto RP30 non esiste hazard pubblico MPS04 (81% in 50 anni = RP~30: il muro informativo).</text>
<text x="752.0" y="471.0" font-size="9" fill="#222" text-anchor="start">2. La coda frequente e fatta di eventi osservati: Mw&gt;=6 ogni ~6,8 anni (CPTI15 1980-2020).</text>
<text x="752.0" y="488.0" font-size="9" fill="#222" text-anchor="start">3. Stima event-based: 77 mln/anno, il 4,5% del limite RP&gt;=30 — correctivo minore, non un raddoppio.</text>
<text x="752.0" y="505.0" font-size="9" fill="#222" text-anchor="start">4. I prior max-ent (P1 3,18 / P2 1,45 mld) si archiviano come bound laschi: scartati dal gate.</text>
<text x="752.0" y="522.0" font-size="9" fill="#222" text-anchor="start">5. Totale RP&gt;=0 = 1,79 mld (1,73x benchmark); chiusura definitiva al passo DBMI15 (danni osservati).</text>
<text x="752.0" y="556.0" font-size="8" fill="#777" text-anchor="start">Nota: il gap 1,035-vs-1,713 mld e artefatto dell'approssimazione CURVE=4 (ratio 1,655</text>
<text x="752.0" y="569.0" font-size="8" fill="#777" text-anchor="start">gia documentato in ep_curve.json), non una sottostima del premio. Dettagli:</text>
<text x="752.0" y="582.0" font-size="8" fill="#777" text-anchor="start">docs/esplorazione_validazione_rp30.md, §6-§7.</text>
<text x="560.0" y="750.0" font-size="8.5" fill="#777" text-anchor="middle">Fonti: INGV CPTI15 v4.0 (Rovida et al.), MPS04, IVASS, AIDA · valori letti da results/esplorazione_*.json · generato da scripts/esplorazione/grafici_rp30.py · dettagli in docs/esplorazione_validazione_rp30.md</text>
